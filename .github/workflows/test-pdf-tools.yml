# Test workflow for pdf-tools build only (fast feedback)

name: test-pdf-tools

on:
  workflow_dispatch:

jobs:
  test_pdf_tools:
    name: Test PDF-Tools Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            msystem: MINGW64
          - os: windows-2025
            msystem: UCRT64
          - os: windows-11-arm
            msystem: CLANGARM64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MSYSTEM: ${{ matrix.msystem }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Msys2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: ${{ matrix.os == 'windows-11-arm' && 'true' || 'false' }}

      - name: Update MSYS2_DIR environment variable
        shell: powershell
        run: |
          echo "MSYS2_DIR=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

      - name: Install base build tools
        shell: msys2 {0}
        run: |
          pacman --noprogressbar --noconfirm --needed -S \
            git zip unzip base-devel ${MINGW_PACKAGE_PREFIX}-toolchain autoconf automake texinfo

      - name: Build PDF-Tools
        shell: msys2 {0}
        run: |
          source scripts/tools.sh
          source scripts/pdf-tools.sh
          emacs_build_root="$(pwd)"
          emacs_build_git_dir="$(pwd)/git"
          emacs_build_build_dir="$(pwd)/build"
          emacs_build_install_dir="$(pwd)/pkg"
          emacs_build_zip_dir="$(pwd)/zips"
          architecture="${MSYSTEM,,}"
          mingw_prefix="${MINGW_PACKAGE_PREFIX}"
          emacs_extensions=""
          mkdir -p "$emacs_build_git_dir" "$emacs_build_build_dir" "$emacs_build_install_dir" "$emacs_build_zip_dir"
          action3_pdf_tools

      - name: Upload PDF-Tools zip
        uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-${{ matrix.msystem }}
          path: zips/pdf-tools-*.zip

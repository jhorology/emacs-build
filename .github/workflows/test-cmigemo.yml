# Test workflow for C/Migemo build only (fast feedback, no Emacs compile)

name: test-cmigemo

on:
  workflow_dispatch:

jobs:
  test_cmigemo:
    name: Test Cmigemo Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            msystem: MINGW64
          - os: windows-2025
            msystem: UCRT64
          - os: windows-11-arm
            msystem: CLANGARM64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      MSYSTEM: ${{ matrix.msystem }}

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: ${{ matrix.os == 'windows-11-arm' && 'true' || 'false' }}

      - name: Install base build tools
        run: |
          pacman --noprogressbar --noconfirm --needed -S \
            git zip unzip base-devel ${MINGW_PACKAGE_PREFIX}-toolchain

      - name: Build Cmigemo
        run: |
          source scripts/tools.sh
          source scripts/cmigemo.sh
          emacs_build_git_dir="$(pwd)/git"
          emacs_build_install_dir="$(pwd)/pkg"
          emacs_build_zip_dir="$(pwd)/zips"
          mingw_prefix="${MINGW_PACKAGE_PREFIX}"
          architecture="${MSYSTEM,,}"
          emacs_extensions=""
          mkdir -p "$emacs_build_git_dir" "$emacs_build_install_dir" "$emacs_build_zip_dir"
          action3_cmigemo

      - name: Upload Cmigemo zip
        uses: actions/upload-artifact@v4
        with:
          name: cmigemo-${{ matrix.msystem }}
          path: zips/cmigemo-*.zip

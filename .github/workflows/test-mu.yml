# Test workflow for mu build only (fast feedback)

name: test-mu

on:
  workflow_dispatch:

jobs:
  test_mu:
    name: Test Mu Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            msystem: MINGW64
          - os: windows-2025
            msystem: UCRT64

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MSYSTEM: ${{ matrix.msystem }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Msys2
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: false

      - name: Update MSYS2_DIR environment variable
        shell: powershell
        run: |
          echo "MSYS2_DIR=${{ steps.msys2.outputs.msys2-location }}" >> $env:GITHUB_ENV

      - name: Install base build tools
        shell: msys2 {0}
        run: |
          pacman --noprogressbar --noconfirm --needed -S \
            git zip unzip base-devel ${MINGW_PACKAGE_PREFIX}-toolchain autoconf automake texinfo

      - name: Setup Dummy Emacs Binary
        shell: msys2 {0}
        run: |
          # action3_mu checks if emacs.exe exists in emacs_install_dir
          architecture="${MSYSTEM,,}"
          mkdir -p "pkg/dummy-mingw-w64-${architecture}/bin"
          touch "pkg/dummy-mingw-w64-${architecture}/bin/emacs.exe"

      - name: Build Mu
        shell: msys2 {0}
        run: |
          source scripts/tools.sh
          source scripts/msys2_extra.sh
          emacs_build_root="$(pwd)"
          emacs_build_git_dir="$(pwd)/git"
          emacs_build_install_dir="$(pwd)/pkg"
          emacs_build_zip_dir="$(pwd)/zips"
          architecture="${MSYSTEM,,}"
          emacs_install_dir="$(pwd)/pkg/dummy-mingw-w64-${architecture}"
          mingw_prefix="${MINGW_PACKAGE_PREFIX}"
          emacs_extensions=""
          mkdir -p "$emacs_build_git_dir" "$emacs_build_install_dir" "$emacs_build_zip_dir"
          action3_mu

      - name: Upload Mu zip
        uses: actions/upload-artifact@v4
        with:
          name: mu-${{ matrix.msystem }}
          path: zips/mu-*.zip
